<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Standup Drafter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="panel">
  <header>
    <span class="title">
      <svg class="app-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <mask id="face-mask">
          <rect x="0" y="0" width="24" height="24" fill="black" />
          <rect x="5.3" y="3.8" width="13.4" height="16.8" rx="2.2" fill="white" />
          <rect x="9.6" y="1.2" width="4.8" height="3.6" rx="0.7" fill="white" />
          <circle cx="9.1" cy="10.6" r="1.1" fill="black" />
          <circle cx="14.9" cy="10.6" r="1.1" fill="black" />
          <path d="M8.6 14.4 L12 17.3 L15.4 14.4" stroke="black" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </mask>
        <rect x="0" y="0" width="24" height="24" fill="currentColor" mask="url(#face-mask)" />
      </svg>
      Standup Drafter
    </span>
    <div class="menu-wrap">
      <button id="menuBtn" class="icon-btn">⋯</button>
      <div id="menuDropdown" class="menu-dropdown" hidden>
        <label class="menu-toggle">
          <input type="checkbox" id="launchAtLoginToggle" />
          Launch at Login
        </label>
        <button id="signOutBtn">Sign out</button>
        <button id="quitBtn">Quit</button>
      </div>
    </div>
  </header>

  <div class="connect-row">
    <svg class="service-icon" height="14" width="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    <span class="connect-label">GitHub</span>
    <span id="githubStatus" class="badge badge-off"><span class="badge-dot"></span>Not connected</span>
    <button id="githubConnectBtn" class="small-btn">Connect</button>
  </div>
  <div id="githubCode" class="code-box" hidden>
    <p>Enter this code in the browser tab that opened:</p>
    <p class="code" id="githubCodeValue"></p>
  </div>

  <div class="connect-row">
    <svg class="service-icon" height="14" width="14" viewBox="0 0 122.8 122.8" aria-hidden="true">
      <path d="M25.8 77.6c0 7.1-5.8 12.9-12.9 12.9S0 84.7 0 77.6s5.8-12.9 12.9-12.9h12.9v12.9zM32.3 77.6c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9v32.3c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V77.6z" fill="#E01E5A"/>
      <path d="M45.2 25.8c-7.1 0-12.9-5.8-12.9-12.9S38.1 0 45.2 0s12.9 5.8 12.9 12.9v12.9H45.2zM45.2 32.3c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H12.9C5.8 58.1 0 52.3 0 45.2s5.8-12.9 12.9-12.9h32.3z" fill="#36C5F0"/>
      <path d="M97 45.2c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9-5.8 12.9-12.9 12.9H97V45.2zM90.5 45.2c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V12.9C64.7 5.8 70.5 0 77.6 0s12.9 5.8 12.9 12.9v32.3z" fill="#2EB67D"/>
      <path d="M77.6 97c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9-12.9-5.8-12.9-12.9V97h12.9zM77.6 90.5c-7.1 0-12.9-5.8-12.9-12.9s5.8-12.9 12.9-12.9h32.3c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H77.6z" fill="#ECB22E"/>
    </svg>
    <span class="connect-label">Slack</span>
    <span id="slackStatus" class="badge badge-off"><span class="badge-dot"></span>Not connected</span>
    <button id="slackConnectBtn" class="small-btn">Connect</button>
  </div>
  <div id="slackTokenRow" class="slack-token-row" hidden>
    <input id="slackTokenInput" type="password" placeholder="xoxb-..." />
    <button id="slackTokenSubmit" class="small-btn">Save</button>
  </div>

  <hr />

  <section id="draftSection" hidden>
    <button id="generateBtn" class="full-btn">Pull yesterday's GitHub activity</button>
    <textarea id="draftText" rows="9" placeholder="Your draft will appear here..."></textarea>
    <div class="row">
      <select id="channelSelect"></select>
      <button id="postBtn">Post</button>
    </div>
  </section>
  <p id="emptyHint" class="hint">Connect both GitHub and Slack to draft a standup.</p>
</div>

  <div id="toast" class="toast" hidden></div>

  <script src="renderer.js"></script>
</body>
</html>
